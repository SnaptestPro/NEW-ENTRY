<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>बँटवारा पंचनामा — अनुसूचि प्रपत्र</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">बँ</div>
    <div>
      <h1>बँटवारा पंचनामा</h1>
      <p>आपसी सहमति के आधार पर अनुसूचि प्रपत्र (Partition Schedule)</p>
    </div>
  </div>
  <div class="top-actions">
    <span class="save-state" id="saveState">● स्वतः सेव चालू</span>
    <button type="button" class="btn ghost" id="btnImport" title="पहले डाउनलोड की हुई DOCX खोलें — सारा डाटा वैसा ही भर जाएगा">📂 DOCX से खोलें</button>
    <input type="file" id="fileImport" accept=".docx" hidden>
    <button type="button" class="btn ghost" id="btnHist" title="पिछला सेव किया हुआ डाटा देखें / वापस लाएँ">🕘 पिछला डाटा <b id="histCount">0</b></button>
    <button type="button" class="btn ghost" id="btnDemo" title="सारा फॉर्म नमूना डाटा से एक क्लिक में भर दें">⚡ डेमो डाटा भरें</button>
    <button type="button" class="btn ghost" id="btnNew">नया फॉर्म</button>
    <button type="button" class="btn primary" id="btnDownload">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
      DOCX डाउनलोड
    </button>
  </div>
</header>

<nav class="steps" id="steps"></nav>

<main class="container">
  <section id="panel"></section>
</main>

<footer class="navbar">
  <div class="navbar-in">
    <button type="button" class="btn ghost" id="btnBack">← पिछला</button>
    <span class="step-label" id="stepLabel"></span>
    <button type="button" class="btn primary" id="btnNext">अगला →</button>
  </div>
</footer>

<div id="histModal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-label="पिछला डाटा">
    <div class="modal-h"><div><h2>🕘 पिछला डाटा</h2><p>नया फॉर्म, डेमो, हटाने या DOCX डाउनलोड से पहले का डाटा अपने-आप यहाँ सेव होता है (अधिकतम पिछले 20)।</p></div><button type="button" class="btn ghost sm" id="histClose">✕ बंद</button></div>
    <div class="modal-b" id="histList"></div>
    <div class="modal-f"><button type="button" class="btn danger sm" id="histClear">सारा पिछला डाटा हटाएँ</button></div>
  </div>
</div>

<div id="dropHint" class="drop-hint" hidden><div>📂 DOCX यहाँ छोड़ें — डाटा अपने-आप भर जाएगा</div></div>

<div id="toast" class="toast"></div>

<script src="jszip.min.js"></script>
<script src="batwara_template.js"></script>
<script src="batwara.js"></script>
<script src="script.js"></script>
</body>
</html>
